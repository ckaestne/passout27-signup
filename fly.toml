# fly.toml app configuration file generated for passout27-signup on 2026-11-26T11:08:58-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'passout27-signup'
primary_region = 'ord'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '1m0s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
